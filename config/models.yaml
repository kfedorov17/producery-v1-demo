# Model-access configuration. This file is the ONLY place model identifiers live.
#
# Each agent in config/agents.yaml names a tier; a tier maps to a Gateway model id. Assignment is static:
# promotion between tiers happens by editing this file behind the eval gate, never at runtime.
#
# The fallback chain mirrors the LangSmith LLM Gateway "fallback chain" object one-to-one
# (primary → 1..5 ordered fallbacks → trigger status codes, transport errors always trigger), so when the
# Gateway is enabled on the org this block is re-entered in LLM Gateway → Model Fallbacks and the app keeps
# sending only the primary id. docs: https://docs.langchain.com/langsmith/llm-gateway-fallbacks
#
# Model ids use the Gateway's provider-prefixed form (<provider>/<model>). Verify ids against the Gateway's
# model list for the workspace before promotion.
gateway:
  # Per-agent identity header; the Gateway records it on every traced call.
  agent_header: x-producery-agent

# List prices (USD per million tokens) for the eval cost metric (producery/evals/cost.py). Matched by substring of the
# model id (longest match wins); `default` covers anything unlisted. Verify against the provider price lists when a
# tier changes; replace with Gateway-reported cost when it is enabled.
pricing:
  default:            { input_per_mtok: 3.0,  output_per_mtok: 15.0 }
  claude-haiku-4-5:   { input_per_mtok: 1.0,  output_per_mtok: 5.0 }
  claude-sonnet-4-6:  { input_per_mtok: 3.0,  output_per_mtok: 15.0 }
  claude-sonnet-5:    { input_per_mtok: 3.0,  output_per_mtok: 15.0 }
  claude-opus:        { input_per_mtok: 15.0, output_per_mtok: 75.0 }
  gpt-5.4-mini:       { input_per_mtok: 0.4,  output_per_mtok: 1.6 }
  gpt-5.4:            { input_per_mtok: 2.5,  output_per_mtok: 10.0 }
  gemini-2.5-pro:     { input_per_mtok: 1.25, output_per_mtok: 10.0 }

# `triggers` documents the Gateway's fallback chain; the interim door fails over on any error, not only these statuses.
tiers:
  fast:
    model: anthropic/claude-haiku-4-5
    fallbacks: [openai/gpt-5.4-mini]
    triggers: [429, 500, 502, 503, 504]
    temperature: 0.0
    max_tokens: 1200
  worker:
    model: anthropic/claude-sonnet-5
    fallbacks: [anthropic/claude-sonnet-4-6, openai/gpt-5.4]
    triggers: [429, 500, 502, 503, 504]
    temperature: 0.0
    max_tokens: 4096
  judge:
    # Cross-family by design: the judge never shares a model family with the tier under test.
    model: openai/gpt-5.4
    fallbacks: [google/gemini-2.5-pro]
    triggers: [429, 500, 502, 503, 504]
    temperature: 0.0
    max_tokens: 600
