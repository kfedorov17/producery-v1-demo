[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "producery"
version = "0.1.0"
description = "Producery — approval-gated inbound-ops agents for small P&C insurance agencies (LangChain + LangGraph + LangSmith)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary — assignment submission" }
dependencies = [
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0",
  "deepagents>=0.7.23,<0.8",
  "langsmith[sandbox]>=0.14.7",
  "langchain-openai>=1.7,<2",
  "langchain-mcp-adapters>=0.2",
  "mcp>=1.30",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "arq>=0.26",
  "psycopg[binary,pool]>=3.2",
  "fastembed>=0.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["producery*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "D"]
ignore = ["S101", "S608", "RUF012", "B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC", "D1"]
"scripts/*" = ["S"]
"producery/worker/main.py" = ["ASYNC230", "S110"]
"producery/server/bootstrap.py" = ["ASYNC230"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
packages = ["producery"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
